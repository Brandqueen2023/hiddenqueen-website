<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HiddenQueen – Private Preview Auswertung</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --ink:#2B2624; --rose:#a97b6c; --line:#e7dad5; --bg:#F7F1EC; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:#121212; color:#fff; padding:20px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1{ font-size:18px; margin:0; font-weight:500; }
  header button{ background:none; border:1px solid rgba(255,255,255,.4); color:#fff; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:13px; }
  main{ max-width:1100px; margin:0 auto; padding:28px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:4px; padding:22px; margin-bottom:20px; }
  #login-view{ max-width:360px; margin:80px auto; }
  input, select, textarea, button{ font-family:inherit; font-size:14px; }
  input[type=password], input[type=text]{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:3px; margin:8px 0 16px; }
  .filters{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .filters select{ padding:8px 10px; border:1px solid var(--line); border-radius:3px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  tr.row{ cursor:pointer; }
  tr.row:hover{ background:#faf5f1; }
  .btn{ background:var(--rose); color:#fff; border:0; padding:9px 16px; border-radius:20px; cursor:pointer; font-size:13px; }
  .btn.secondary{ background:none; border:1px solid var(--line); color:var(--ink); }
  .btn.danger{ background:#a5493a; }
  .badge{ display:inline-block; padding:2px 9px; border-radius:10px; background:#eee; font-size:11.5px; }
  .boundary{ background:rgba(207,156,140,.12); border:1px solid rgba(207,156,140,.4); padding:10px 12px; border-radius:3px; margin:6px 0; }
  .kv{ display:grid; grid-template-columns:180px 1fr; gap:6px 14px; font-size:13.5px; margin:14px 0; }
  .kv div:nth-child(odd){ color:#8a7c78; }
  #detail-view{ display:none; }
  #detail-view textarea{ width:100%; min-height:90px; padding:10px; border:1px solid var(--line); border-radius:3px; }
  .err{ color:#a5493a; font-size:13px; }
  .hidden{ display:none; }
</style>
</head>
<body>
<header>
  <h1>HiddenQueen · Private Preview Auswertung</h1>
  <button id="logout-btn" class="hidden">Abmelden</button>
</header>
<main>

  <div id="login-view" class="card">
    <p>Bitte melde dich an.</p>
    <form id="login-form">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="btn" type="submit">Anmelden</button>
      <p class="err" id="login-err"></p>
    </form>
  </div>

  <div id="list-view" class="hidden">
    <div class="card">
      <div class="filters">
        <select id="f-status"><option value="">Alle Status</option></select>
        <select id="f-collection"><option value="">Alle Kollektionen</option></select>
        <input type="text" id="f-from" placeholder="Von (YYYY-MM-DD)" style="width:150px;">
        <input type="text" id="f-to" placeholder="Bis (YYYY-MM-DD)" style="width:150px;">
        <button class="btn secondary" id="filter-apply">Filtern</button>
        <button class="btn secondary" id="export-btn">CSV-Export</button>
      </div>
      <table>
        <thead><tr><th>Datum</th><th>Name</th><th>Ort</th><th>Top-Kollektion</th><th>Eignung</th><th>Status</th><th>Marketing</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
  </div>

  <div id="detail-view" class="card">
    <button class="btn secondary" id="back-btn">&larr; Zur Liste</button>
    <div class="kv" id="detail-kv"></div>
    <div id="detail-boundary"></div>
    <h3>Antworten</h3>
    <pre id="detail-answers" style="white-space:pre-wrap; font-size:12.5px; background:#faf5f1; padding:12px; border-radius:3px;"></pre>
    <h3>Status</h3>
    <select id="detail-status"></select>
    <h3>Interne Notiz</h3>
    <textarea id="detail-note"></textarea>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn" id="save-btn">Speichern</button>
      <button class="btn danger" id="delete-btn">Löschen</button>
    </div>
    <p class="err" id="detail-err"></p>
  </div>

</main>
<script src="/admin/admin.js"></script>
</body>
</html>
