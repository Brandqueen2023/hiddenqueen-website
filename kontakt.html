<!DOCTYPE html><html lang="de"><head>
  <meta charset="utf-8">
  <title>Kontakt | HiddenQueen</title>
  <meta name="description" content="Kontaktiere HiddenQueen persönlich und diskret bei Fragen zur Marke oder zur Private Preview.">
  <link rel="canonical" href="https://www.thehiddenqueen.de/kontakt">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kontakt | HiddenQueen">
  <meta property="og:description" content="Kontaktiere HiddenQueen persönlich und diskret bei Fragen zur Marke oder zur Private Preview.">
  <meta property="og:image" content="https://www.thehiddenqueen.de/images/og-share.jpg">
  <meta property="og:url" content="https://www.thehiddenqueen.de/kontakt">
  <meta name="twitter:card" content="summary_large_image">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/rebecca-49efb2-f56c2ef41e7f7513b87432e5.webflow.css" rel="stylesheet" type="text/css">
  <link href="css/hq-brand.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
  <script type="text/javascript">WebFont.load({ google: { families: ["Cinzel:300,400,500,600,700","Inter:300,400,500,600,700"] } });</script>
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
</head>
<body>
<a class="hq-skip-link" href="#hq-main">Zum Inhalt springen</a>
<main id="hq-main">

  <section class="hq-hero" style="min-height:46vh;">
    <div class="hq-hero-media"><img src="/images/hero-kontakt.webp" alt="Cremefarbene Maske neben einer kupferfarbenen, geprägten Karte" style="--fp:50% 30%" srcset="/images/hero-kontakt-640.webp 640w, /images/hero-kontakt-960.webp 960w, /images/hero-kontakt-1280.webp 1280w, /images/hero-kontakt-1600.webp 1600w" sizes="100vw" fetchpriority="high"></div>
    <div class="hq-hero-content">
      <h1 class="hq-h1">Manche Fragen gehören nicht in ein Fragetool.</h1>
      <p class="hq-sub" style="color:#D9CCC7;">Schreib uns so viel oder so wenig, wie sich richtig anfühlt.</p>
      <p class="hq-lead">Wir antworten persönlich und diskret.</p>
    </div>
  </section>

  <section class="hq-section hq-section--ivory">
    <div class="hq-inner hq-inner--narrow">
      <form id="hq-contact-form" novalidate="">
        <div class="hq-honeypot" aria-hidden="true">
          <label for="hq-c-website">Website</label>
          <input type="text" id="hq-c-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <input type="hidden" name="form_started_at" id="hq-c-started">

        <div class="hq-field">
          <label for="hq-c-firstname">Vorname</label>
          <input class="hq-input" type="text" id="hq-c-firstname" name="firstname" required="" autocomplete="given-name">
        </div>

        <div class="hq-field">
          <label for="hq-c-email">E-Mail-Adresse</label>
          <input class="hq-input" type="email" id="hq-c-email" name="email" required="" autocomplete="email">
        </div>

        <div class="hq-field">
          <label for="hq-c-topic">Anliegen</label>
          <select class="hq-select" id="hq-c-topic" name="topic" required="">
            <option value="Private Preview">Private Preview</option>
            <option value="HiddenQueen allgemein">HiddenQueen allgemein</option>
            <option value="Kooperation oder Presse">Kooperation oder Presse</option>
            <option value="Datenschutz">Datenschutz</option>
            <option value="Sonstiges">Sonstiges</option>
          </select>
        </div>

        <div class="hq-field">
          <label for="hq-c-message">Nachricht</label>
          <textarea class="hq-textarea" id="hq-c-message" name="message" required="" maxlength="2000"></textarea>
        </div>

        <div class="hq-checkbox-row">
          <input type="checkbox" id="hq-c-consent" name="consent" required="">
          <label for="hq-c-consent">Ich stimme zu, dass meine Angaben zur Bearbeitung meiner Anfrage verarbeitet werden.</label>
        </div>

        <button type="submit" class="hq-btn hq-btn--primary" id="hq-c-submit">Nachricht senden</button>
        <p class="hq-form-status" id="hq-c-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

</main>
<script>
(function () {
  var form = document.getElementById('hq-contact-form');
  if (!form) return;
  document.getElementById('hq-c-started').value = Date.now();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var status = document.getElementById('hq-c-status');
    var btn = document.getElementById('hq-c-submit');
    var data = {
      firstname: form.firstname.value.trim(),
      email: form.email.value.trim(),
      topic: form.topic.value,
      message: form.message.value.trim(),
      consent: form.consent.checked,
      website: form.website.value,
      form_started_at: form.form_started_at.value
    };
    if (!data.firstname || !data.email || !data.message || !data.consent) {
      status.textContent = 'Bitte fülle alle Pflichtfelder aus und bestätige die Einwilligung.';
      status.dataset.state = 'error';
      return;
    }
    btn.disabled = true;
    status.textContent = '';
    status.removeAttribute('data-state');

    fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (res) { return res.json().then(function (json) { return { ok: res.ok, json: json }; }); })
      .then(function (r) {
        btn.disabled = false;
        if (r.ok && r.json.ok) {
          form.reset();
          form.style.display = 'none';
          status.textContent = 'Deine Nachricht ist angekommen.\n\nWir melden uns persönlich bei dir.';
          status.dataset.state = 'success';
          if (window.hqTrack) window.hqTrack('contact_submit', {});
        } else {
          status.textContent = 'Das hat gerade nicht funktioniert. Deine Nachricht ist noch da. Bitte versuche es erneut.';
          status.dataset.state = 'error';
        }
      })
      .catch(function () {
        btn.disabled = false;
        status.textContent = 'Das hat gerade nicht funktioniert. Deine Nachricht ist noch da. Bitte versuche es erneut.';
        status.dataset.state = 'error';
      });
  });
})();
</script>


</body></html>
